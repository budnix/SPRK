<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <script>try{var t=JSON.parse(localStorage.getItem("sprk.settings")||"{}").theme;if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="icon" href="data:," />
  <title>SPRK – Symulator Prowadzenia Ruchu Kolejowego</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand"><span class="logo">SPRK</span><span id="station-name">…</span></div>
      <div class="clock"><span id="clock">00:00:00</span></div>
      <div class="controls">
        <button id="btn-pause" class="tb" title="Pauza (spacja)">❚❚</button>
        <div class="speed" id="speed"></div>
        <button id="btn-help" class="tb" title="Instrukcja obsługi">?</button>
        <button id="btn-menu" class="tb" title="Menu" aria-haspopup="true" aria-expanded="false">☰</button>
      </div>
      <div id="menu" class="menu hidden" role="menu">
        <h4>Ustawienia</h4>
        <fieldset>
          <legend>Położenie pulpitu</legend>
          <label><input type="radio" name="deskPos" value="top"> góra</label>
          <label><input type="radio" name="deskPos" value="middle"> środek</label>
          <label><input type="radio" name="deskPos" value="bottom"> dół</label>
        </fieldset>
        <fieldset>
          <legend>Motyw interfejsu</legend>
          <label><input type="radio" name="theme" value="dark"> ciemny</label>
          <label><input type="radio" name="theme" value="light"> jasny</label>
        </fieldset>
        <fieldset>
          <legend>Stanowisko obsługi (urządzenia srk)</legend>
          <label><input type="radio" name="srk" value="auto"> wg stacji</label>
          <label><input type="radio" name="srk" value="E"> pulpit kostkowy (typ E)</label>
          <label><input type="radio" name="srk" value="komputerowe"> komputerowe (monitor)</label>
        </fieldset>
        <fieldset>
          <legend>Panel boczny (rozkład, dziennik, stan)</legend>
          <label><input type="radio" name="sidePos" value="right"> po prawej</label>
          <label><input type="radio" name="sidePos" value="left"> po lewej</label>
          <label><input type="radio" name="sidePos" value="bottom"> na dole</label>
        </fieldset>
        <div class="menu-actions"><button type="button" id="menu-new" class="tb">Nowa zmiana…</button> <button type="button" id="menu-report" class="tb">Raport zmiany</button> <button type="button" id="menu-help" class="tb">Instrukcja obsługi</button></div>
      </div>
    </header>
    <main id="main">
      <section id="desk-wrap">
        <div id="desk-tabs" class="hidden"></div>
        <div id="cmd-host"></div>
        <div id="desk-scroll"><div id="desk"></div></div>
        <div id="desk-tools">
          <button class="tb" id="zoom-out">−</button>
          <button class="tb" id="zoom-fit">dopasuj</button>
          <button class="tb" id="zoom-in">+</button>
          <button class="tb" id="zoom-height" title="Dopasuj do wysokości (przewijanie w poziomie)">↕ wysokość</button>
          <div id="mini-tabs" class="mini-tabs" aria-label="Panel boczny (zwinięty)"></div>
          <span id="status" class="status"></span>
          <span id="hint" class="hint">kliknij = naciśnij · przytrzymaj / prawy przycisk = wyciągnij</span>
        </div>
      </section>
      <aside id="side"></aside>
    </main>
  </div>
  <div id="help" class="modal hidden"></div>
  <div id="start" class="modal hidden"></div>
  <div id="report" class="modal hidden"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
