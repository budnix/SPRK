<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <script>(function(){var t=null;try{t=JSON.parse(localStorage.getItem("sprk.settings")||"{}").theme;}catch(e){}if(t!=="dark"&&t!=="light")t=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t;})();</script>
  <link rel="icon" href="data:," />
  <title>SPRK – Symulator Prowadzenia Ruchu Kolejowego</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand"><span class="logo">SPRK</span><span id="station-name">…</span></div>
      <div class="clock"><span id="clock">00:00:00</span></div>
      <div class="controls">
        <button id="btn-pause" class="tb" title="Pauza (spacja)">❚❚</button>
        <div class="speed" id="speed"></div>
        <button id="btn-help" class="tb" title="Instrukcja obsługi">?</button>
        <button id="btn-menu" class="tb" title="Menu" aria-haspopup="true" aria-expanded="false">☰</button>
      </div>
      <div id="menu" class="menu hidden" role="menu">
        <h4>Menu</h4>
        <div class="menu-actions">
          <button type="button" id="menu-new" class="tb">Nowa zmiana…</button>
          <button type="button" id="menu-settings" class="tb">Ustawienia…</button>
          <button type="button" id="menu-report" class="tb">Raport zmiany</button>
          <button type="button" id="menu-help" class="tb">Instrukcja obsługi</button>
        </div>
      </div>
    </header>
    <main id="main">
      <section id="desk-wrap">
        <div id="desk-tabs" class="hidden"></div>
        <div id="cmd-host"></div>
        <div id="desk-scroll"><div id="desk"></div></div>
        <div id="desk-tools">
          <div class="tool-group tg-screens hidden" id="screen-group"><span class="lbl">ekran</span><div id="screen-tabs" class="screen-tabs seg" aria-label="Ekrany pulpitu"></div></div>
          <div class="tool-group tg-zoom"><span class="lbl">widok</span><div class="seg"><button class="tb" id="zoom-out" title="Pomniejsz">−</button><button class="tb" id="zoom-fit" title="Dopasuj do szerokości okna">dopasuj</button><button class="tb hidden" id="zoom-fit-h" title="Wypełnij okno w pionie – środek przewijany, skrajne pola z blokadą przypięte">wysokość</button><button class="tb" id="zoom-in" title="Powiększ">+</button></div></div>
          <div class="tool-group tg-panel"><span class="lbl">panel</span><button class="tb" id="side-toggle" title="Ukryj / pokaż panel boczny">ukryj</button><div id="mini-tabs" class="mini-tabs seg" aria-label="Panel boczny (zwinięty)"></div></div>
          <span id="status" class="status"></span>
          <span id="hint" class="hint">kliknij = naciśnij · przytrzymaj / prawy przycisk = wyciągnij</span>
        </div>
      </section>
      <aside id="side"></aside>
    </main>
  </div>
  <div id="help" class="modal hidden"></div>
  <div id="start" class="modal hidden"></div>
  <div id="report" class="modal hidden"></div>
  <div id="settings" class="modal hidden"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
