<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <script>(function(){var t=null;try{t=JSON.parse(localStorage.getItem("sprk.settings")||"{}").theme;}catch(e){}if(t!=="dark"&&t!=="light")t=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t;})();</script>
  <link rel="icon" href="data:," />
  <title>SPRK – Symulator Prowadzenia Ruchu Kolejowego</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand"><span class="logo">SPRK</span><span id="station-name">…</span></div>
      <div class="clock"><span id="clock">00:00:00</span></div>
      <div class="controls">
        <button id="btn-pause" class="tb" title="Pauza (spacja)" data-i18n-title="top.pause">❚❚</button>
        <div class="speed" id="speed"></div>
        <button id="btn-help" class="tb" title="Instrukcja obsługi" data-i18n-title="top.help">?</button>
        <button id="btn-menu" class="tb" title="Menu" data-i18n-title="top.menu" aria-haspopup="true" aria-expanded="false">☰</button>
      </div>
      <div id="menu" class="menu hidden" role="menu">
        <h4 data-i18n="menu.title">Menu</h4>
        <div class="menu-actions">
          <button type="button" id="menu-new" class="tb" data-i18n="menu.new">Nowa zmiana…</button>
          <button type="button" id="menu-settings" class="tb" data-i18n="menu.settings">Ustawienia…</button>
          <button type="button" id="menu-report" class="tb" data-i18n="menu.report">Raport zmiany</button>
          <button type="button" id="menu-help" class="tb" data-i18n="menu.help">Instrukcja obsługi</button>
        </div>
      </div>
    </header>
    <main id="main">
      <section id="desk-wrap">
        <div id="desk-tabs" class="hidden"></div>
        <div id="cmd-host"></div>
        <div id="desk-scroll"><div id="desk"></div></div>
        <div id="desk-tools">
          <div class="tool-group tg-panel"><span class="lbl" data-i18n="tools.panel">panel</span><div id="panel-tabs" class="panel-tabs" aria-label="Zakładki panelu bocznego" data-i18n-aria="tools.panelTabs"></div></div>
          <span id="status" class="status"></span>
          <div class="tg-right">
            <div class="tool-group tg-view"><span class="lbl" data-i18n="tools.view">widok</span><div id="screen-group" class="hidden"><div id="screen-tabs" class="screen-tabs seg" aria-label="Ekrany pulpitu" data-i18n-aria="tools.screens"></div></div><div class="seg"><button class="tb" id="zoom-out" title="Pomniejsz" data-i18n-title="tools.zoomOut">−</button><button class="tb tb-icon" id="zoom-fit" title="Dopasuj do szerokości okna" data-i18n-title="tools.fitW" aria-label="Dopasuj do szerokości" data-i18n-aria="tools.fitWShort"><svg viewBox="0 0 22 14" width="18" height="11" aria-hidden="true"><path d="M1.5 2v10M20.5 2v10M5 7h12M5 7l3-3M5 7l3 3M17 7l-3-3M17 7l-3 3" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="tb tb-icon hidden" id="zoom-fit-h" title="Dopasuj do wysokości okna – środek przewijany, skrajne pola z blokadą przypięte" data-i18n-title="tools.fitH" aria-label="Dopasuj do wysokości" data-i18n-aria="tools.fitHShort"><svg viewBox="0 0 14 22" width="11" height="18" aria-hidden="true"><path d="M2 1.5h10M2 20.5h10M7 5v12M7 5l-3 3M7 5l3 3M7 17l-3-3M7 17l3-3" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="tb" id="zoom-in" title="Powiększ" data-i18n-title="tools.zoomIn">+</button></div></div>
            <span id="hint" class="hint">kliknij = naciśnij · przytrzymaj / prawy przycisk = wyciągnij</span>
            <div class="tool-group tg-toggle"><button class="tb tb-icon" id="side-toggle" title="Ukryj panel boczny" data-i18n-title="tools.hideSide" aria-label="Ukryj panel" data-i18n-aria="tools.hidePanel" aria-pressed="true"><svg viewBox="0 0 14 14" width="14" height="14" aria-hidden="true"><path d="M3 2.5l4 4 4-4M3 8l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
          </div>
        </div>
      </section>
      <aside id="side"></aside>
    </main>
  </div>
  <div id="help" class="modal hidden"></div>
  <div id="start" class="modal hidden"></div>
  <div id="report" class="modal hidden"></div>
  <div id="settings" class="modal hidden"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
