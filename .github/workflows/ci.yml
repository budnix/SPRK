name: CI i deploy na GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# system maszyn przypięty (nie ubuntu-latest): zmiana systemu to świadoma zmiana w tym pliku, jak obraz Playwrighta
jobs:
  test:
    name: Testy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: Testy e2e (Playwright, część ${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    # obraz z gotowym Chromium i czcionkami DejaVu – wzorce zrzutów ekranu są z niego zależne
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # dwie maszyny (shardy) × dwa procesy, strony ze zbudowanej paczki (vite preview) zamiast serwera deweloperskiego
      - run: npx playwright test --shard=${{ matrix.shard }}/2
        env:
          CI: 1
          HOME: /root
          SPRK_E2E_PREVIEW: 1
      - name: Wyniki (ślady, zrzuty) przy błędzie
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-wyniki-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  build:
    name: Build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (ścieżka bazowa /<repo>/)
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy na GitHub Pages
    needs: [build, test, e2e]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # tylko publikacja jest serializowana – testy i build kolejnych pushów biegną równolegle
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
